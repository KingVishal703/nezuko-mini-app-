<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Vip Reels</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<!-- Adsgram SDK -->
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<!-- Monetag SDK — In-App Interstitial -->
<script src="//libtl.com/sdk.js" data-zone="11841425" data-sdk="show_11841425"></script>
  
<style>
  :root {
    --bg: #07070b;
    --panel: #14141c;
    --panel-2: #1c1c27;
    --accent: #6c8dff;
    --accent-2: #9b6bff;
    --accent-warm: #ffc24d;
    --text: #f5f5f8;
    --text-dim: #9b9bab;
    --line: rgba(255,255,255,.08);
    --glass: rgba(20,20,28,.55);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  button { font-family: inherit; cursor: pointer; }

  #feed {
    height: 100vh; height: 100dvh;
    overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none;
  }
  #feed::-webkit-scrollbar { display: none; }

  .reel {
    position: relative; height: 100vh; height: 100dvh;
    scroll-snap-align: start; scroll-snap-stop: always;
    display: flex; align-items: center; justify-content: center; background: #000;
  }
  .reel video { width: 100%; height: 100%; object-fit: contain; background: #000; }

  .reel .overlay-bottom {
    position: absolute; left: 0; right: 74px; bottom: 0;
    padding: 60px 16px max(26px, env(safe-area-inset-bottom));
    background: linear-gradient(to top, rgba(0,0,0,.85), rgba(0,0,0,.4) 55%, transparent);
    pointer-events: none;
  }
  .uploader {
    display: inline-block; font-weight: 700; font-size: 15px;
    padding: 5px 12px 5px 6px; border-radius: 20px;
    background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--line);
  }
  .caption { font-size: 14px; color: #d6d6df; margin-top: 8px; line-height: 1.45; text-shadow: 0 1px 4px rgba(0,0,0,.6); }

  .side-actions {
    position: absolute; right: 10px; bottom: 96px;
    display: flex; flex-direction: column; align-items: center; gap: 18px;
  }
  .action-btn {
    background: none; border: none; color: var(--text);
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    font-size: 11px; font-weight: 600; text-shadow: 0 1px 4px rgba(0,0,0,.6);
  }
  .action-btn .icon {
    width: 48px; height: 48px; border-radius: 50%;
    background: var(--glass); border: 1px solid var(--line);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    display: flex; align-items: center; justify-content: center; font-size: 22px;
    transition: transform .15s ease, background .15s ease;
  }
  .action-btn.liked .icon { background: rgba(255,70,100,.28); border-color: rgba(255,70,100,.5); color: #ff4664; animation: pop .3s ease; }
  .action-btn:active .icon { transform: scale(.85); }
  @keyframes pop { 50% { transform: scale(1.25); } }
  .action-btn.delete-btn .icon { background: rgba(255,70,70,.2); border-color: rgba(255,70,70,.4); color: #ff5c5c; }

  .top-bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 5;
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px; padding-top: max(12px, env(safe-area-inset-top));
    background: linear-gradient(to bottom, rgba(0,0,0,.7), transparent);
    pointer-events: none;
  }
  .top-bar .title {
    font-weight: 800; font-size: 20px; letter-spacing: .3px;
    background: linear-gradient(90deg, #fff, #b9c6ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .coin-pill {
    pointer-events: auto; background: var(--glass); border: 1px solid var(--line);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-radius: 22px; padding: 7px 13px;
    display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700;
    color: var(--accent-warm); transition: transform .15s ease;
  }
  .coin-pill:active { transform: scale(.94); }
  .coin-pill.pulse { animation: pillPulse .6s ease; }
  @keyframes pillPulse {
    0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,194,77,.7); }
    40% { transform: scale(1.18); box-shadow: 0 0 0 12px rgba(255,194,77,0); }
    100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,194,77,0); }
  }

  .empty-state {
    height: 100vh; height: 100dvh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; padding: 0 32px; gap: 10px;
  }
  .empty-state .big { font-size: 48px; }
  .empty-state p { color: var(--text-dim); font-size: 14px; margin: 0; line-height: 1.5; }

  /* Sheets */
  #stats-sheet, #withdraw-sheet {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border-top: 1px solid var(--line); border-radius: 24px 24px 0 0;
    padding: 12px 20px max(20px, env(safe-area-inset-bottom));
    transform: translateY(110%); transition: transform .3s cubic-bezier(.2,.8,.2,1);
    box-shadow: 0 -10px 40px rgba(0,0,0,.55);
  }
  #stats-sheet { z-index: 20; }
  #withdraw-sheet { z-index: 25; max-height: 85vh; overflow-y: auto; }
  #stats-sheet.open, #withdraw-sheet.open { transform: translateY(0); }
  #stats-sheet::before, #withdraw-sheet::before {
    content: ""; display: block; width: 40px; height: 4px; border-radius: 4px;
    background: rgba(255,255,255,.18); margin: 0 auto 14px;
  }
  #stats-sheet h3, #withdraw-sheet h3 { margin: 0; font-size: 18px; font-weight: 800; }
  #stats-sheet h3 { margin-bottom: 12px; }

  .stat-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 14px; color: var(--text-dim); }
  .stat-row:last-of-type { border-bottom: none; }
  .stat-row .val { font-weight: 800; color: var(--text); font-size: 15px; }
  #close-stats { width: 100%; margin-top: 12px; padding: 13px; border: none; border-radius: 14px; background: rgba(255,255,255,.08); color: var(--text); font-size: 14px; font-weight: 600; }
  #open-withdraw-from-stats {
    width: 100%; margin-top: 14px; padding: 14px; border: none; border-radius: 14px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; font-size: 15px; font-weight: 700;
    box-shadow: 0 8px 22px rgba(108,141,255,.35);
  }

  /* Withdraw header (close button upar) */
  .withdraw-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  #close-withdraw {
    width: 36px; height: 36px; border: none; border-radius: 50%; padding: 0;
    background: rgba(255,255,255,.1); color: var(--text); font-size: 16px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  #close-withdraw:active { transform: scale(.9); }
  .withdraw-balance-card {
    background: linear-gradient(135deg, rgba(255,194,77,.18), rgba(155,107,255,.14));
    border: 1px solid rgba(255,194,77,.25); border-radius: 16px; padding: 14px 16px; margin-bottom: 8px;
  }
  .withdraw-balance { margin: 0; color: var(--text-dim); font-size: 13px; }
  .withdraw-balance b { color: var(--accent-warm); font-size: 26px; font-weight: 800; display: block; margin-top: 2px; }

  .withdraw-section-title { font-size: 13px; color: var(--text-dim); margin: 20px 0 10px; font-weight: 700; letter-spacing: .3px; }
  .withdraw-section-title:first-child { margin-top: 0; }

  .plan-card {
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(255,255,255,.05); border: 1px solid var(--line);
    border-radius: 16px; padding: 14px 16px; margin-bottom: 10px;
  }
  .plan-card .plan-info .plan-title { font-weight: 700; font-size: 14px; }
  .plan-card .plan-info .plan-sub { font-size: 12px; color: var(--accent-warm); margin-top: 3px; }
  .plan-card button {
    border: none; border-radius: 20px; padding: 9px 18px; font-size: 13px; font-weight: 700;
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; white-space: nowrap;
  }
  .plan-card button:disabled { background: rgba(255,255,255,.1); color: var(--text-dim); }

  .money-box { background: rgba(255,255,255,.05); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
  .money-box .rate-line { font-size: 12px; color: var(--text-dim); margin-bottom: 12px; }
  .money-box input {
    width: 100%; padding: 13px 14px; margin-bottom: 10px; border-radius: 12px;
    border: 1px solid rgba(255,255,255,.12); background: rgba(0,0,0,.35); color: var(--text); font-size: 14px; outline: none;
  }
  .money-box input:focus { border-color: var(--accent); }
  .money-box input::placeholder { color: var(--text-dim); }
  .money-box button {
    width: 100%; padding: 13px; border: none; border-radius: 14px;
    background: linear-gradient(135deg, #ffd166, var(--accent-warm)); color: #1a1200; font-weight: 800; font-size: 14px;
  }
  .money-box button:disabled { opacity: .5; }

  .withdraw-msg { margin-top: 14px; font-size: 13px; text-align: center; min-height: 18px; }
  .withdraw-msg.success { color: #4ade80; }
  .withdraw-msg.error { color: #ff5c5c; }

  /* Onboarding */
  #onboarding {
    position: fixed; inset: 0; z-index: 50;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 20px; padding: 32px; text-align: center;
    background: radial-gradient(circle at 50% 25%, #23233a, var(--bg) 70%);
  }
  #onboarding .logo-wrap {
    width: 124px; height: 124px; border-radius: 32px;
    background: linear-gradient(145deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center; font-size: 58px;
    box-shadow: 0 16px 50px rgba(108,141,255,.45); animation: float 3s ease-in-out infinite;
  }
  @keyframes float { 50% { transform: translateY(-8px); } }
  #onboarding h1 { margin: 0; font-size: 28px; font-weight: 800; }
  #onboarding p { margin: 0; color: var(--text-dim); font-size: 14px; line-height: 1.6; max-width: 300px; }
  #start-watching-btn {
    margin-top: 8px; padding: 15px 44px; border: none; border-radius: 30px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; font-size: 16px; font-weight: 700;
    box-shadow: 0 10px 28px rgba(108,141,255,.4);
  }
  #start-watching-btn:active { transform: scale(.97); }

  /* Buffering spinner */
  .loading-spinner {
    display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 42px; height: 42px; border: 3px solid rgba(255,255,255,.2); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .8s linear infinite; pointer-events: none;
  }
  .reel.buffering .loading-spinner { display: block; }
  @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }

  /* 2x speed indicator */
  .speed-badge {
    display: none; position: absolute; top: 18%; left: 50%; transform: translateX(-50%);
    background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--line); color: #fff; font-weight: 700; font-size: 14px;
    padding: 8px 16px; border-radius: 20px; pointer-events: none;
  }
  .reel.speeding .speed-badge { display: block; }

  /* Coin reward animation (ad ke baad) */
  #reward-layer { position: fixed; inset: 0; z-index: 90; pointer-events: none; overflow: hidden; }
  .reward-toast {
    position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%) scale(.6);
    text-align: center; opacity: 0; animation: toastIn 1.9s ease forwards;
  }
  .reward-toast .big-coin { font-size: 72px; filter: drop-shadow(0 8px 24px rgba(255,194,77,.7)); animation: spinCoin 1.2s ease; }
  .reward-toast .amt { font-size: 30px; font-weight: 800; color: var(--accent-warm); text-shadow: 0 4px 18px rgba(0,0,0,.7); }
  .reward-toast .sub { font-size: 13px; color: #fff; opacity: .85; margin-top: 2px; text-shadow: 0 2px 10px rgba(0,0,0,.8); }
  @keyframes toastIn {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(.5); }
    18% { opacity: 1; transform: translate(-50%, -50%) scale(1.12); }
    30% { transform: translate(-50%, -50%) scale(1); }
    78% { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -80%) scale(.95); }
  }
  @keyframes spinCoin { from { transform: rotateY(0); } to { transform: rotateY(720deg); } }
  .fly-coin {
    position: absolute; font-size: 26px; will-change: transform, opacity;
    transition: transform .9s cubic-bezier(.5,0,.75,.4), opacity .9s ease;
  }

   /* Swipe-up hint */
  #swipe-hint {
    position: fixed; left: 0; right: 0; bottom: 14%; z-index: 40;
    display: flex; justify-content: center; pointer-events: none;
    opacity: 0; transition: opacity .3s ease;
  }
  #swipe-hint.show { opacity: 1; }
  .hint-wrap { position: relative; width: 140px; height: 210px; display: flex; justify-content: center; }
  .hint-chevrons { position: absolute; top: 0; display: flex; flex-direction: column; gap: 4px; }
  .hint-chevrons i {
    width: 20px; height: 20px; border-left: 4px solid #fff; border-top: 4px solid #fff;
    border-radius: 4px; transform: rotate(45deg); opacity: 0;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,.6));
  }
  #swipe-hint.show .hint-chevrons i { animation: chevUp 1.3s ease-in-out infinite; }
  .hint-chevrons i:nth-child(3) { animation-delay: 0s; }
  .hint-chevrons i:nth-child(2) { animation-delay: .2s; }
  .hint-chevrons i:nth-child(1) { animation-delay: .4s; }
  @keyframes chevUp { 0%, 70%, 100% { opacity: 0; } 30% { opacity: 1; } }

  .hint-finger {
    position: absolute; bottom: 40px; width: 54px; height: 54px; border-radius: 50%;
    background: rgba(255,255,255,.88);
    box-shadow: 0 0 0 10px rgba(255,255,255,.22), 0 8px 22px rgba(0,0,0,.5);
    opacity: 0;
  }
  #swipe-hint.show .hint-finger { animation: fingerSwipe 1.3s cubic-bezier(.4,0,.2,1) infinite; }
  @keyframes fingerSwipe {
    0%   { transform: translateY(0) scale(1.15); opacity: 0; }
    15%  { transform: translateY(0) scale(.9);  opacity: 1; }
    70%  { transform: translateY(-100px) scale(.9); opacity: 1; }
    100% { transform: translateY(-125px) scale(.75); opacity: 0; }
  }

  .hint-text {
    position: absolute; bottom: 0; white-space: nowrap;
    background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--line); border-radius: 20px; padding: 7px 16px;
    font-size: 13px; font-weight: 700; color: #fff;
  }

    /* Bonus button (timer ring) */
  .bonus-btn .icon {
    position: relative; --p: 0;
    background: conic-gradient(var(--accent-warm) calc(var(--p) * 1%), rgba(255,255,255,.18) 0);
    border: none;
  }
  .bonus-btn .icon::after {
    content: ""; position: absolute; inset: 3px; border-radius: 50%; background: #1c1c27;
  }
  .bonus-btn .icon .bonus-emoji { position: relative; z-index: 1; }
  .bonus-btn .bonus-label { font-variant-numeric: tabular-nums; }
  .bonus-btn.ready .icon {
    background: linear-gradient(135deg, #ffd166, var(--accent-warm));
    animation: bonusPulse 1.2s ease-in-out infinite;
  }
  .bonus-btn.ready .icon::after { background: transparent; }
  .bonus-btn.ready .bonus-label { color: var(--accent-warm); }
  @keyframes bonusPulse {
    0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,194,77,.6); }
    50% { transform: scale(1.08); box-shadow: 0 0 0 10px rgba(255,194,77,0); }
  }
  
</style>
</head>
<body>

<div id="onboarding">
  <div class="logo-wrap">🎬</div>
  <h1>Vip Reels</h1>
  <p>Chhote videos, endless scroll. Dekho, like karo, share karo — aur ads dekh kar coins kamao.</p>
  <button id="start-watching-btn">▶ Start Watching</button>
</div>

<div class="top-bar">
  <div class="title">Vip Reels</div>
  <div style="pointer-events:auto; display:flex; gap:8px;">
    <button class="coin-pill" id="stats-btn" style="color:var(--text);">📊</button>
    <button class="coin-pill" id="coin-btn">🪙 <span id="coin-count">0</span></button>
  </div>
</div>

<div id="feed"></div>
<div id="reward-layer"></div>

  <div id="swipe-hint">
  <div class="hint-wrap">
    <div class="hint-chevrons"><i></i><i></i><i></i></div>
    <div class="hint-finger"></div>
    <div class="hint-text">Swipe up, next reel dekho</div>
  </div>
  </div>

<div id="stats-sheet">
  <h3>Tumhare Stats</h3>
  <div class="stat-row"><span>Videos uploaded</span><span class="val" id="s-videos">0</span></div>
  <div class="stat-row"><span>Total views</span><span class="val" id="s-views">0</span></div>
  <div class="stat-row"><span>Total likes</span><span class="val" id="s-likes">0</span></div>
  <div class="stat-row"><span>Coins earned</span><span class="val" id="s-coins">0</span></div>
  <button id="open-withdraw-from-stats">🎁 Coins Withdraw Karo</button>
  <button id="close-stats">Band Karo</button>
</div>

<div id="withdraw-sheet">
  <div class="withdraw-head">
    <h3>🎁 Withdraw</h3>
    <button id="close-withdraw" aria-label="Band Karo">✕</button>
  </div>
  <div class="withdraw-balance-card">
    <p class="withdraw-balance">Balance <b><span id="w-balance">0</span> 🪙</b></p>
  </div>

  <div id="withdraw-plans-loading" style="color:var(--text-dim); font-size:13px;">Loading options…</div>
  <div id="withdraw-plans" style="display:none;"></div>

  <div id="withdraw-msg" class="withdraw-msg"></div>
</div>

<script>
// Mini App Vercel par hai, backend (bot + API ek hi service) Koyeb par.
// Yahan Koyeb wali service ka poora HTTPS URL daalo.
const API_BASE = "https://p01--telegram-mini-gram-mini-bot--xxhdzhcw6m7q.code.run".replace(/\/+$/, "");

// Onboarding splash ke liye platform image (chaaho to emoji ki jagah asli
// logo image URL daal do, jaise "https://.../logo.png")
const PLATFORM_LOGO_URL = ""; // khali rehne do to emoji use hoga

// ---------------------------------------------------------------------
// Ad networks — jitni chaho utni networks yahan define kar sakte ho, lekin
// ek time par sirf EK hi "active" network chalti hai — jo AD_NETWORKS mein
// niche select ki hai. Naya network add karna ho to bas ek naya entry
// jodo (uska SDK <script> tag <head> mein daalo), aur ACTIVE_AD_NETWORK ko
// uska naam de do jab wo use karni ho.
// ---------------------------------------------------------------------
const ADS_EVERY_N_REELS = 3;   // har N reels ke baad ad
const AD_REWARD_AMOUNT = 0.7;

// Yahan decide karo kaunsi network abhi live hai:
const ACTIVE_AD_NETWORK = "adsgram";

const AD_NETWORKS = {
  adsgram: {
    blockId: "int-49106", // <-- Adsgram dashboard se
    controller: null,
    init() {
      if (window.Adsgram && this.blockId !== "YOUR_ADSGRAM_BLOCK_ID") {
        this.controller = window.Adsgram.init({ blockId: this.blockId });
      }
    },
    async show() {
      if (!this.controller) throw new Error("Adsgram configured nahi hai");
      await this.controller.show();
    },
  },
  
  // Naya network add karna ho to bas yahan ek aur key daalo, jaise:
  // monetag2: {
  //   init() { /* SDK <head> mein load kiya ho to yahan setup karo */ },
  //   async show() { /* SDK ka rewarded-ad show() call karo */ },
  // },
};

Object.values(AD_NETWORKS).forEach(n => {
  try { n.init(); } catch (e) { console.log("Ad network init failed", e); }
});

const tg = window.Telegram?.WebApp;
tg?.ready();
tg?.expand();

const userId = tg?.initDataUnsafe?.user?.id || 0; // fallback 0 for local testing outside Telegram
const feedEl = document.getElementById("feed");
const coinCountEl = document.getElementById("coin-count");

let reelsSinceAd = 0;

async function maybeShowAd() {
  reelsSinceAd++;
  if (reelsSinceAd < ADS_EVERY_N_REELS) return;
  reelsSinceAd = 0;

  const network = AD_NETWORKS[ACTIVE_AD_NETWORK];
  if (!network) return;

  pauseAllReels(); // ad chalte time background reel band
  try {
    await network.show(); // resolves jab ad poora dekh liya jaaye
    const res = await fetch(`${API_BASE}/api/ad_reward`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ user_id: userId, amount: AD_REWARD_AMOUNT, ad_type: "rewarded" }),
    });
    const data = await res.json();
    coinCountEl.textContent = data.coins.toFixed(1);
    playRewardAnimation(AD_REWARD_AMOUNT);
  } catch (e) {
    console.log(`${ACTIVE_AD_NETWORK} ad skipped/failed`, e);
  }
  resumeCurrentReel(); // ad band hone par reel wapas chalu
}

// Ad ke time saari reels pause, baad mein current reel resume
let currentReelVideo = null;
function pauseAllReels() {
  document.querySelectorAll(".reel video").forEach(v => v.pause());
}
function resumeCurrentReel() {
  if (currentReelVideo) currentReelVideo.play().catch(() => {});
}

// Ad close hone ke baad coin animation
function playRewardAnimation(amount) {
  const layer = document.getElementById("reward-layer");
  const pill = document.getElementById("coin-btn");
  tg?.HapticFeedback?.notificationOccurred("success");

  const toast = document.createElement("div");
  toast.className = "reward-toast";
  toast.innerHTML = `<div class="big-coin">🪙</div><div class="amt">+${amount} Coins</div><div class="sub">Ad dekhne ka reward mila 🎉</div>`;
  layer.appendChild(toast);
  setTimeout(() => toast.remove(), 2000);

  const target = pill.getBoundingClientRect();
  const tx = target.left + target.width / 2, ty = target.top + target.height / 2;
  const sx = window.innerWidth / 2, sy = window.innerHeight * 0.4;
  for (let i = 0; i < 10; i++) {
    const c = document.createElement("div");
    c.className = "fly-coin";
    c.textContent = "🪙";
    const ox = sx + (Math.random() - 0.5) * 140, oy = sy + (Math.random() - 0.5) * 100;
    c.style.left = ox + "px"; c.style.top = oy + "px";
    layer.appendChild(c);
    setTimeout(() => {
      c.style.transform = `translate(${tx - ox}px, ${ty - oy}px) scale(.4)`;
      c.style.opacity = "0.2";
    }, 700 + i * 70);
    setTimeout(() => c.remove(), 1900 + i * 70);
  }
  setTimeout(() => {
    pill.classList.remove("pulse"); void pill.offsetWidth; pill.classList.add("pulse");
  }, 1100);
}

// ---------------------------------------------------------------------
// Buffering spinner — video load ho rahi ho to dikhta hai
// ---------------------------------------------------------------------
function attachBufferingIndicator(videoEl, reelEl) {
  videoEl.addEventListener("waiting", () => reelEl.classList.add("buffering"));
  videoEl.addEventListener("playing", () => reelEl.classList.remove("buffering"));
  videoEl.addEventListener("canplay", () => reelEl.classList.remove("buffering"));
}

// ---------------------------------------------------------------------
// Instagram-style gestures:
//   - Tap (bina hilaye) -> play/pause toggle
//   - Right side pe hold karke rakhna -> 2x speed, chhodte hi normal
//   - Scroll/swipe ke saath conflict na ho isliye movement track karte hain
// ---------------------------------------------------------------------
function attachGestures(videoEl, reelEl) {
  const MOVE_THRESHOLD = 12; // px — isse zyada hile to "tap" nahi, "scroll" maano
  const HOLD_DELAY = 220;    // ms — itni der dabaye rakhne par hold shuru

  let startX = 0, startY = 0, moved = false, isHolding = false, holdTimer = null;

  function endHold() {
    if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
    if (isHolding) {
      videoEl.playbackRate = 1;
      reelEl.classList.remove("speeding");
      isHolding = false;
    }
  }

  videoEl.addEventListener("pointerdown", (e) => {
    startX = e.clientX;
    startY = e.clientY;
    moved = false;

    const rect = videoEl.getBoundingClientRect();
    const isRightSide = (e.clientX - rect.left) > rect.width * 0.5;

    holdTimer = setTimeout(() => {
      if (!moved && isRightSide) {
        videoEl.playbackRate = 2;
        reelEl.classList.add("speeding");
        isHolding = true;
      }
    }, HOLD_DELAY);
  });

  videoEl.addEventListener("pointermove", (e) => {
    if (Math.abs(e.clientX - startX) > MOVE_THRESHOLD || Math.abs(e.clientY - startY) > MOVE_THRESHOLD) {
      moved = true;
      endHold();
    }
  });

  videoEl.addEventListener("pointerup", () => {
    const wasHolding = isHolding;
    endHold();
    if (!moved && !wasHolding) {
      // Sirf ek chhota tap tha — play/pause toggle karo
      if (videoEl.paused) videoEl.play().catch(() => {});
      else videoEl.pause();
    }
  });

  videoEl.addEventListener("pointercancel", endHold);
  videoEl.addEventListener("pointerleave", endHold);
}

// ---------------------------------------------------------------------
// Autoplay the reel in view + count a view + trigger ads + prefetch next
// ---------------------------------------------------------------------
function observeReels() {
  const reelEls = Array.from(document.querySelectorAll(".reel"));
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      const reelEl = entry.target;
      const video = reelEl.querySelector("video");
      if (entry.isIntersecting && entry.intersectionRatio > 0.6) {
        currentReelVideo = video;
        video.play().catch(() => {});
        registerView(reelEl.dataset.videoId);
        maybeShowAd();

        // Agli reel ko thodi der baad (scroll settle hone ke baad) load
        // karna shuru karo — turant karne se scroll ke beech jank aata hai,
        // jo kabhi-kabhi ek se zyada reels skip hone ki wajah banta hai
        const idx = reelEls.indexOf(reelEl);
        const nextVideo = reelEls[idx + 1]?.querySelector("video");
        if (nextVideo && nextVideo.preload !== "auto") {
          setTimeout(() => {
            nextVideo.preload = "auto";
            nextVideo.load();
          }, 250);
        }
      } else {
        video.pause();
      }
    });
  }, { threshold: [0.6] });

  reelEls.forEach(r => observer.observe(r));
}

const viewedThisSession = new Set();
async function registerView(videoId) {
  if (viewedThisSession.has(videoId)) return;
  viewedThisSession.add(videoId);
  await fetch(`${API_BASE}/api/view`, {

// Bonus button — timer ke baad rewarded ad, ad ke baad coins
// ---------------------------------------------------------------------
const BONUS_COOLDOWN_SEC = 60;                       // timer (seconds) — apne hisab se badlo
const BONUS_REWARD_COINS = 3;                        // bonus coins — apne hisab se badlo
const BONUS_BLOCK_ID = "49067";     // <-- Adsgram ke Rewarded block ki ID

let bonusReadyAt = Date.now() + BONUS_COOLDOWN_SEC * 1000;
let bonusBusy = false;
let bonusController = null;

function updateBonusUI() {
  const left = Math.max(0, bonusReadyAt - Date.now());
  const ready = left === 0 && !bonusBusy;
  const pct = Math.min(100, (1 - left / (BONUS_COOLDOWN_SEC * 1000)) * 100);
  const sec = Math.ceil(left / 1000);
  const timeText = Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0");

  document.querySelectorAll(".bonus-btn").forEach(btn => {
    btn.classList.toggle("ready", ready);
    btn.disabled = !ready;
    btn.querySelector(".icon").style.setProperty("--p", pct);
    btn.querySelector(".bonus-label").textContent = bonusBusy ? "..." : (ready ? "Bonus" : timeText);
  });
}
setInterval(updateBonusUI, 250);

async function claimBonus() {
  if (bonusBusy || Date.now() < bonusReadyAt) return;

  if (!window.Adsgram || BONUS_BLOCK_ID === "YOUR_REWARDED_BLOCK_ID") {
    const msg = "Bonus ad abhi set nahi hai.";
    if (tg?.showAlert) tg.showAlert(msg); else alert(msg);
    return;
  }

  bonusBusy = true;
  updateBonusUI();
  pauseAllReels();

  let watched = false;
  try {
    bonusController = bonusController || window.Adsgram.init({ blockId: BONUS_BLOCK_ID });
    await bonusController.show();     // poora dekhne par resolve, skip par error
    watched = true;
  } catch (e) {
    console.log("Bonus ad skipped/failed", e);
  }

  if (watched) {
    try {
      const res = await fetch(`${API_BASE}/api/ad_reward`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ user_id: userId, amount: BONUS_REWARD_COINS, ad_type: "bonus" }),
      });
      const data = await res.json();
      coinCountEl.textContent = data.coins.toFixed(1);
      playRewardAnimation(BONUS_REWARD_COINS);
    } catch (e) {
      console.log("Bonus reward failed", e);
    }
    bonusReadyAt = Date.now() + BONUS_COOLDOWN_SEC * 1000;   // timer dobara shuru
  }

  bonusBusy = false;
  updateBonusUI();
  resumeCurrentReel();
}
